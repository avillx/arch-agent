openapi: "3.0.3"
info:
  title: Arch Agent API
  description: REST API for managing autonomous agents, sessions, tasks, tools, MCP servers, memory, activity, providers, and streaming chat completions.
  version: "1.0.0"

servers:
  - url: http://localhost:8080/
    description: Local development server

tags:
  - name: Chat
    description: Streaming chat completions with an agent.
  - name: Sessions
    description: Create, list, get, and delete agent sessions.
  - name: Tasks
    description: Periodic autonomous tasks for agents.
  - name: Tools
    description: List registered tool servers.
  - name: MCP
    description: Connect, disconnect, and list MCP servers.
  - name: Memory
    description: List and retrieve agent memory records and manage consolidation config.
  - name: Activity
    description: Retrieve agent activity logs and manage reporting config.
  - name: Agents
    description: Create, read, update, and delete agents.
  - name: Providers
    description: Configure API providers and model settings.
  - name: Tool Results
    description: Resolve client-provided tool call results.

paths:
  # ── Chat ──────────────────────────────────────────────────────────────
  /chat/{agent}/{session}:
    post:
      tags: [Chat]
      summary: Start a chat completion
      description: |
        Initiates an agent chat completion and streams events via Server-Sent Events (SSE).
        Each event is a JSON object prefixed with `data: `. The stream ends with `data: [DONE]`.
        On failure before the stream starts (bad request) or during the run, the server
        emits an SSE `error: <json>` frame with a `400` status when possible.
      operationId: chat
      parameters:
        - $ref: "#/components/parameters/AgentID"
        - $ref: "#/components/parameters/Session"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_request]
              properties:
                user_request:
                  type: array
                  description: User message content as an array of content parts.
                  items:
                    $ref: "#/components/schemas/ContentPart"
                logging:
                  type: boolean
                  description: Enable logging for this chat invocation.
                  default: false
                additional_prompt:
                  type: string
                  description: Additional prompt text appended to the system prompt.
                tool_servers:
                  type: array
                  description: |
                    External client-side tool servers the agent can use for this call.
                    The client guarantees execution and returns results via the tool result endpoint.
                  items:
                    $ref: "#/components/schemas/ProvidedToolServer"
      responses:
        "200":
          description: |
            SSE stream of completion events. Each event is a JSON object wrapped as `data: <json>\n\n`.
            The stream ends with `data: [DONE]`.
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/ChatEvent"
        "400":
          description: |
            Bad request delivered as an SSE `error: <json>` frame before the stream starts
            (for example, a malformed JSON body).

  /chat/{agent}/{session}/interrupt:
    post:
      tags: [Chat]
      summary: Interrupt a running chat completion
      description: |
        Interrupts the current chat completion for the given agent and session.
      operationId: interruptChat
      parameters:
        - $ref: "#/components/parameters/AgentID"
        - $ref: "#/components/parameters/Session"
      responses:
        "202":
          description: Interruption accepted.

  # ── Sessions ──────────────────────────────────────────────────────────
  /session/{agent}:
    post:
      tags: [Sessions]
      summary: Create a new session
      description: |
        Creates a new session for the agent. A session holds the conversation history,
        token usage, and metadata.
      operationId: createSession
      parameters:
        - $ref: "#/components/parameters/AgentID"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                instruction:
                  type: string
                  description: Optional initial instruction stored in session extras.
      responses:
        "200":
          description: Session created.
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id:
                    type: string
                    description: The created session ID.
        "400":
          $ref: "#/components/responses/BadRequest"
    get:
      tags: [Sessions]
      summary: List sessions for an agent
      description: Returns a list of session headers for the given agent.
      operationId: listSessions
      parameters:
        - $ref: "#/components/parameters/AgentID"
      responses:
        "200":
          description: Array of session headers.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SessionHeader"
        "400":
          $ref: "#/components/responses/MessageError"

  /session/{agent}/{session}:
    get:
      tags: [Sessions]
      summary: Get a session by ID
      description: Returns the full session data including message history, token usage, and timestamps.
      operationId: getSession
      parameters:
        - $ref: "#/components/parameters/AgentID"
        - $ref: "#/components/parameters/Session"
      responses:
        "200":
          description: Full session data.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/MessageError"
    delete:
      tags: [Sessions]
      summary: Delete a session
      description: Deletes a session and all its messages. This action is irreversible.
      operationId: deleteSession
      parameters:
        - $ref: "#/components/parameters/AgentID"
        - $ref: "#/components/parameters/Session"
      responses:
        "200":
          description: Session deleted.
        "400":
          $ref: "#/components/responses/MessageError"

  # ── Tasks ─────────────────────────────────────────────────────────────
  /task:
    get:
      tags: [Tasks]
      summary: List all tasks
      operationId: listTasks
      responses:
        "200":
          description: All registered tasks.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TaskConfig"

  /task/{name}:
    post:
      tags: [Tasks]
      summary: Create a task
      description: |
        Creates a periodic autonomous task for the agent. Tasks are executed on a cron schedule
        and can send requests to one or more agent recipients. The task `name` is taken from the
        request body, not the path.
      operationId: createTask
      parameters:
        - $ref: "#/components/parameters/TaskName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskConfig"
      responses:
        "200":
          description: Task created.
        "400":
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
    delete:
      tags: [Tasks]
      summary: Delete a task
      description: Deletes a task and stops its cron schedule.
      operationId: deleteTask
      parameters:
        - $ref: "#/components/parameters/TaskName"
      responses:
        "200":
          description: Task deleted.
        "404":
          $ref: "#/components/responses/MessageError"
    patch:
      tags: [Tasks]
      summary: Patch a task
      description: |
        Partially updates a task. Only the supplied fields are updated.
        To deactivate a task, set `active` to `false`.
      operationId: patchTask
      parameters:
        - $ref: "#/components/parameters/TaskName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskPatch"
      responses:
        "200":
          description: Task patched.
        "400":
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "404":
          $ref: "#/components/responses/MessageError"

  # ── Tools ─────────────────────────────────────────────────────────────
  /tools:
    get:
      tags: [Tools]
      summary: List all registered tool servers and their tools
      description: |
        Returns all tool servers known to the system, keyed by server name.
        Each server maps tool names to their descriptions.
      operationId: listTools
      responses:
        "200":
          description: Tool servers with their tools.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolServers"

  # ── MCP ───────────────────────────────────────────────────────────────
  /mcp:
    get:
      tags: [MCP]
      summary: List connected MCP servers
      description: |
        Returns all currently connected MCP servers, keyed by server ID.
        Each entry contains the gateway config and the server's tools.
      operationId: listMCPServers
      responses:
        "200":
          description: MCP servers with their configs and tools.
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  $ref: "#/components/schemas/MCPServerInfo"

  /mcp/{mcp}:
    post:
      tags: [MCP]
      summary: Connect an MCP server
      description: |
        Connects (or replaces) an MCP server with the ID given in the path.
        Two connection methods are supported:
        - `http_gateway`: connect to a remote MCP server via URL.
        - `command_gateway`: spawn a local MCP server process.
        Exactly one of `http_gateway` or `command_gateway` must be provided.
      operationId: connectMCP
      parameters:
        - $ref: "#/components/parameters/MCPID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServerGatewayConfig"
      responses:
        "200":
          description: MCP server connected.
        "400":
          description: Validation error or server failed to start.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
    delete:
      tags: [MCP]
      summary: Disconnect an MCP server
      description: |
        Disconnects an MCP server by ID. The server's tools become unavailable
        to agents after disconnection.
      operationId: disconnectMCP
      parameters:
        - $ref: "#/components/parameters/MCPID"
      responses:
        "200":
          description: MCP server disconnected.
        "400":
          $ref: "#/components/responses/MessageError"

  # ── Memory ────────────────────────────────────────────────────────────
  /memory/{agent}:
    get:
      tags: [Memory]
      summary: List memory records for an agent
      description: |
        Returns the memory index for the agent — an object mapping memory record names
        to their descriptions.
      operationId: listMemories
      parameters:
        - $ref: "#/components/parameters/AgentID"
      responses:
        "200":
          description: Memory index for the agent.
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
                description: Map of memory record name to its description.
        "404":
          $ref: "#/components/responses/MessageError"

  /memory/{agent}/{memory_name}:
    get:
      tags: [Memory]
      summary: Get a specific memory record
      description: |
        Returns the full content of a named memory record for the agent.
      operationId: getMemory
      parameters:
        - $ref: "#/components/parameters/AgentID"
        - $ref: "#/components/parameters/MemoryName"
      responses:
        "200":
          description: Memory record content.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryDetail"
        "400":
          $ref: "#/components/responses/MessageError"

  /memory/{agent}/consolidate:
    post:
      tags: [Memory]
      summary: Consolidate memory for an agent
      description: |
        Triggers memory consolidation as an SSE stream.
        Returns completion events as the consolidation agent runs.
      operationId: consolidateMemory
      parameters:
        - $ref: "#/components/parameters/AgentID"
      responses:
        "200":
          description: |
            SSE stream of consolidation completion events. Each event is a JSON object
            wrapped as `data: <json>\n\n`. The stream ends with `data: [DONE]`.
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/ConsolidationCompletionEvent"
        "400":
          description: Agent memory is disabled.
        "404":
          description: Agent not found.
        "500":
          description: Internal error.

  /memory/config:
    get:
      tags: [Memory]
      summary: Get memory consolidation config
      operationId: getMemoryConfig
      responses:
        "200":
          description: Current consolidation config.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsolidatorConfig"
    post:
      tags: [Memory]
      summary: Update memory consolidation config
      operationId: setMemoryConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsolidatorConfig"
      responses:
        "200":
          description: Config saved.
        "400":
          description: Invalid request body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "404":
          $ref: "#/components/responses/MessageError"

  # ── Activity ───────────────────────────────────────────────────────────
  /activity:
    get:
      tags: [Activity]
      summary: Get activity logs for a period
      description: |
        Retrieves activity logs for the specified agent and time range.
      operationId: getActivity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent, from]
              properties:
                agent:
                  type: string
                  description: Agent identifier.
                from:
                  type: string
                  format: date-time
                  description: Start of the time range.
                to:
                  type: string
                  format: date-time
                  description: End of the time range (optional).
      responses:
        "200":
          description: Activity logs for the period.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityRecord"
        "400":
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "404":
          $ref: "#/components/responses/MessageError"

  /activity/config:
    get:
      tags: [Activity]
      summary: Get activity reporting config
      operationId: getActivityConfig
      responses:
        "200":
          description: Current activity config.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityConfig"
    post:
      tags: [Activity]
      summary: Update activity reporting config
      operationId: setActivityConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivityConfig"
      responses:
        "200":
          description: Config saved.
        "400":
          $ref: "#/components/responses/BadRequest"

  # ── Agents ─────────────────────────────────────────────────────────────
  /agent:
    get:
      tags: [Agents]
      summary: List all agents
      operationId: listAgents
      responses:
        "200":
          description: List of all configured agents.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgentConfig"

  /agent/{id}:
    get:
      tags: [Agents]
      summary: Get an agent by ID
      description: Returns the full configuration of an agent including model, memory settings, prompt, and allowed tools.
      operationId: getAgent
      parameters:
        - $ref: "#/components/parameters/EntityID"
      responses:
        "200":
          description: Agent details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentConfig"
        "400":
          $ref: "#/components/responses/MessageError"
    post:
      tags: [Agents]
      summary: Create an agent
      description: |
        Creates a new agent with the ID given in the path. At minimum, a model must be specified.
      operationId: createAgent
      parameters:
        - $ref: "#/components/parameters/EntityID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentConfig"
      responses:
        "200":
          description: Agent created.
        "400":
          $ref: "#/components/responses/BadRequest"
    put:
      tags: [Agents]
      summary: Update an agent
      description: |
        Fully replaces the agent configuration. This is a PUT operation — all fields
        must be provided.
      operationId: updateAgent
      parameters:
        - $ref: "#/components/parameters/EntityID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentConfig"
      responses:
        "200":
          description: Agent updated.
        "400":
          $ref: "#/components/responses/BadRequest"
    delete:
      tags: [Agents]
      summary: Delete an agent
      description: Deletes an agent and all its associated sessions and memory records.
      operationId: deleteAgent
      parameters:
        - $ref: "#/components/parameters/EntityID"
      responses:
        "200":
          description: Agent deleted.
        "400":
          $ref: "#/components/responses/MessageError"

  # ── Providers ──────────────────────────────────────────────────────────
  /providers:
    get:
      tags: [Providers]
      summary: List all providers
      description: |
        Returns all configured API providers. Providers are OpenAI-compatible
        API endpoints.
      operationId: listProviders
      responses:
        "200":
          description: Array of provider configs.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProviderConfig"
    post:
      tags: [Providers]
      summary: Add a provider
      description: |
        Adds a new API provider. The provider must have a unique name, a base URL,
        and an API type. The API key is stored separately via `key_ref`.
      operationId: addProvider
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderConfig"
      responses:
        "200":
          description: Provider created (empty body).
        "400":
          description: Validation error or provider already exists.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ValidationError"
                  - $ref: "#/components/schemas/Error"
              examples:
                duplicates:
                  summary: Provider already exists
                  value:
                    message: "provider already exist"
                validation:
                  summary: Validation problems
                  value:
                    problems:
                      name: "must be not empty"

  /providers/{name}:
    get:
      tags: [Providers]
      summary: Get a provider by name
      description: Returns the full configuration of a provider, including its model configurations.
      operationId: getProvider
      parameters:
        - $ref: "#/components/parameters/ProviderName"
      responses:
        "200":
          description: Provider config.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderConfig"
        "404":
          $ref: "#/components/responses/MessageError"
    patch:
      tags: [Providers]
      summary: Update a provider
      description: |
        Partially updates a provider configuration. Only supplied fields are updated.
      operationId: updateProvider
      parameters:
        - $ref: "#/components/parameters/ProviderName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderConfigPatch"
      responses:
        "200":
          description: Provider updated (empty body).
        "400":
          description: Invalid request body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "404":
          $ref: "#/components/responses/MessageError"
    delete:
      tags: [Providers]
      summary: Delete a provider
      description: Deletes a provider and all its model configurations.
      operationId: deleteProvider
      parameters:
        - $ref: "#/components/parameters/ProviderName"
      responses:
        "200":
          description: Provider deleted (empty body).
        "404":
          $ref: "#/components/responses/MessageError"

  /providers/{name}/models/{model}:
    post:
      tags: [Providers]
      summary: Set model configuration
      description: |
        Sets configuration for a model. The model name in the path is base64url-encoded.
        Model configuration is provider-specific and may include settings like
        temperature, max_tokens, and top_p.
      operationId: setModelConfig
      parameters:
        - $ref: "#/components/parameters/ProviderName"
        - $ref: "#/components/parameters/ModelName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModelConfig"
      responses:
        "200":
          description: Model configuration set (empty body).
        "400":
          description: Bad request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                badEncoding:
                  summary: Bad base64url encoding
                  value:
                    message: "'model' path value bad encoding"
                emptyModel:
                  summary: Empty model name
                  value:
                    message: "empty model name"
                unsupportedAPI:
                  summary: Unsupported API type
                  value:
                    message: "api is not supported"
    delete:
      tags: [Providers]
      summary: Delete a model configuration
      description: |
        Deletes a model configuration. The model name in the path is base64url-encoded.
      operationId: deleteModelConfig
      parameters:
        - $ref: "#/components/parameters/ProviderName"
        - $ref: "#/components/parameters/ModelName"
      responses:
        "200":
          description: Model configuration deleted (empty body).
        "400":
          description: Bad request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                badEncoding:
                  summary: Bad base64url encoding
                  value:
                    message: "model_name bad encoding"
                providerNotExist:
                  summary: Provider not found
                  value:
                    message: "provider is not exist"

  # ── Provided Tool Result ──────────────────────────────────────────────
  /toolresult/{id}:
    post:
      tags: [Tool Results]
      summary: Resolve a provided tool call result
      description: |
        Called by the external tool server to provide the result of a tool call
        that was previously emitted via `provided_toolcall` event during a chat stream.
      operationId: resolveToolCall
      parameters:
        - $ref: "#/components/parameters/ToolResultID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ToolResultPayload"
      responses:
        "200":
          description: Result accepted.
        "400":
          $ref: "#/components/responses/MessageError"

# ── Components ──────────────────────────────────────────────────────────
components:
  parameters:
    AgentID:
      name: agent
      in: path
      required: true
      schema:
        type: string
      description: Agent identifier.
    Session:
      name: session
      in: path
      required: true
      schema:
        type: string
      description: Session identifier.
    TaskName:
      name: name
      in: path
      required: true
      schema:
        type: string
      description: Task name.
    ProviderName:
      name: name
      in: path
      required: true
      schema:
        type: string
      description: Provider name.
    MCPID:
      name: mcp
      in: path
      required: true
      schema:
        type: string
      description: MCP server ID.
    MemoryName:
      name: memory_name
      in: path
      required: true
      schema:
        type: string
      description: Memory record name.
    EntityID:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Entity identifier (agent ID).
    ToolResultID:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Tool call ID received in the `provided_toolcall` event.
    ModelName:
      name: model
      in: path
      required: true
      schema:
        type: string
      description: Base64url-encoded model name.

  schemas:
    # ── Generic ─────────────────────────────────────────────────────────
    Error:
      type: object
      description: Error response.
      properties:
        message:
          type: string
          description: Human-readable error message.
      example:
        message: "agent not found"

    ValidationError:
      type: object
      description: Validation error response with per-field problems.
      properties:
        problems:
          oneOf:
            - type: object
              description: Map of field names to error messages.
              additionalProperties:
                type: string
            - type: string
              description: A single error message.
      example:
        problems:
          schedule: "invalid cron"

    ContentPart:
      type: object
      description: A part of message content. Both fields are always present (empty when unused).
      properties:
        text:
          type: string
          description: Plain text content.
        image_url:
          type: string
          description: |
            Base64-encoded image data URL (e.g. `data:image/png;base64,...`).
            Supported formats: PNG, JPEG, WebP, BMP.
      example:
        text: "Hello, how are you?"
        image_url: ""

    ToolCall:
      type: object
      description: A tool call made by the model during a chat completion.
      required: [id, tool, args]
      properties:
        id:
          type: string
          description: Tool call ID assigned by the model provider.
        tool:
          type: string
          description: Tool name.
        args:
          type: object
          description: Tool arguments. The actual schema is determined by the tool definition.
      example:
        id: "call_abc123"
        tool: "read_file"
        args:
          path: "/data/report.txt"

    ToolRepr:
      type: object
      description: A mapping of tool name to its description.
      additionalProperties:
        type: string

    ToolServers:
      type: object
      description: A mapping of tool server name to its tools.
      additionalProperties:
        $ref: "#/components/schemas/ToolRepr"

    # ── Session ─────────────────────────────────────────────────────────
    SessionHeader:
      type: object
      description: |
        Metadata for a single session. The `error` field is only present for
        broken (unreadable) session headers.
      required: [session_id, input_tokens, output_tokens, created_at, updated_at]
      properties:
        session_id:
          type: string
        input_tokens:
          type: integer
          format: int64
        output_tokens:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        extras:
          type: object
          additionalProperties: true
        error:
          type: string
          description: Present only when the session header is broken.

    Session:
      type: object
      description: |
        A session represents a conversation with an agent.
        It contains the message history, token usage, and timestamps.
      required: [session_id, input_tokens, output_tokens, created_at, updated_at, messages]
      properties:
        session_id:
          type: string
        input_tokens:
          type: integer
          format: int64
        output_tokens:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        extras:
          type: object
          additionalProperties: true
        error:
          type: string
        messages:
          type: array
          items:
            $ref: "#/components/schemas/MessageDTO"

    MessageDTO:
      type: object
      description: A single message in a session conversation.
      required: [role, content]
      properties:
        role:
          type: string
          enum: [agent, user, tool, system]
          description: "Message role: `agent` (assistant response), `user`, `tool` (tool result), or `system`."
        content:
          type: array
          items:
            $ref: "#/components/schemas/ContentPart"
        tool_calls:
          type: array
          description: Present only on `agent` messages.
          items:
            $ref: "#/components/schemas/ToolCall"

    # ── Task ────────────────────────────────────────────────────────────
    TaskConfig:
      type: object
      description: |
        Configuration for a periodic autonomous task.
        Tasks are executed on a cron schedule and send requests to agent recipients.
      required: [name, description, recipients, schedule, request]
      properties:
        name:
          type: string
        description:
          type: string
        recipients:
          type: array
          description: Agent IDs that receive the task.
          items:
            type: string
        schedule:
          type: string
          description: "5-field cron expression (minute hour day-of-month month day-of-week), e.g. `0 9 * * 1`."
          example: "0 9 * * 1"
        request:
          type: string
          description: The task request text.
        active:
          type: boolean
          description: Whether the task is active.
        oneshot:
          type: boolean
          description: Whether the task runs only once.

    TaskPatch:
      type: object
      description: Partial update for a task. Only supplied fields are updated.
      properties:
        name:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        recipients:
          type: array
          nullable: true
          items:
            type: string
        schedule:
          type: string
          nullable: true
        request:
          type: string
          nullable: true
        active:
          type: boolean
          nullable: true
        oneshot:
          type: boolean
          nullable: true

    # ── Chat ────────────────────────────────────────────────────────────
    ProvidedToolServer:
      type: object
      description: |
        Client-provided tool servers available for a single chat call.
        The client guarantees execution and returns results via the tool result endpoint.
      required: [tools]
      properties:
        tools:
          type: array
          items:
            $ref: "#/components/schemas/ProvidedTool"
        instruction:
          type: string
          description: Optional instruction for the agent about how to use these tools.

    ProvidedTool:
      type: object
      description: A single client-provided tool with optional JSON Schema for parameters.
      required: [name, description]
      properties:
        name:
          type: string
        description:
          type: string
        schema:
          type: object
          description: Optional JSON Schema for the tool's parameters.

    # ── Chat Events ─────────────────────────────────────────────────────
    # Each SSE event is a flat JSON object with an inline `type` discriminator.

    CompletionEvent:
      type: object
      description: A successful completion chunk. Emitted with type `complete`.
      required: [type, done, completion, tool_calls]
      properties:
        type:
          type: string
          enum: [complete]
        done:
          type: boolean
          description: Whether this is the final completion chunk.
        completion:
          type: string
          description: The completion text chunk.
        tool_calls:
          type: array
          description: Tool calls made by the model.
          items:
            $ref: "#/components/schemas/ToolCall"

    CompletionMistakeEvent:
      type: object
      description: A completion failure. Emitted with type `complete_mistake`.
      required: [type, error]
      properties:
        type:
          type: string
          enum: [complete_mistake]
        error:
          type: string
          description: Human-readable error message from the completion attempt.

    ToolErrorEvent:
      type: object
      description: A tool execution error. Emitted with type `tool_error`.
      required: [type, cause, tool_name, args]
      properties:
        type:
          type: string
          enum: [tool_error]
        cause:
          type: string
          description: Human-readable error message.
        tool_name:
          type: string
          description: Name of the tool that failed.
        args:
          type: string
          description: Raw tool arguments as a JSON string (empty when the tool was called without arguments).

    ToolResultEvent:
      type: object
      description: Result of a tool call. Emitted with type `tool_result`.
      required: [type, id, result]
      properties:
        type:
          type: string
          enum: [tool_result]
        id:
          type: string
          description: Tool call ID.
        result:
          type: array
          description: Tool call result content.
          items:
            $ref: "#/components/schemas/ContentPart"

    LoopExitEvent:
      type: object
      description: The agent runtime stopped. Emitted with type `loop_exit`.
      required: [type]
      properties:
        type:
          type: string
          enum: [loop_exit]
        cause:
          type: string
          description: Human-readable error message explaining why the loop exited (empty when no error).

    CompactionEvent:
      type: object
      description: Session context was compacted. Emitted with type `compaction`.
      required: [type, message, result]
      properties:
        type:
          type: string
          enum: [compaction]
        message:
          type: string
          description: Human-readable compaction status message.
        result:
          type: string
          description: Compaction summary text.

    ProvidedToolCallEvent:
      type: object
      description: The agent called a client-provided tool. Emitted with type `provided_toolcall`.
      required: [type, tool, agent_id, session_id]
      properties:
        type:
          type: string
          enum: [provided_toolcall]
        tool:
          type: string
          description: Tool name.
        args:
          type: object
          description: Tool arguments (omitted when empty).
        result_id:
          type: string
          description: URL-safe id for calling the /toolresult/{id} endpoint to resolve this call.
        agent_id:
          type: string
          description: Agent identifier.
        session_id:
          type: string
          description: Session identifier.

    ChatEvent:
      type: object
      description: |
        A single SSE event in the chat stream. A flat JSON object whose `type`
        field determines the payload.
      discriminator:
        propertyName: type
        mapping:
          complete: "#/components/schemas/CompletionEvent"
          complete_mistake: "#/components/schemas/CompletionMistakeEvent"
          tool_result: "#/components/schemas/ToolResultEvent"
          tool_error: "#/components/schemas/ToolErrorEvent"
          loop_exit: "#/components/schemas/LoopExitEvent"
          compaction: "#/components/schemas/CompactionEvent"
          provided_toolcall: "#/components/schemas/ProvidedToolCallEvent"
      oneOf:
        - $ref: "#/components/schemas/CompletionEvent"
        - $ref: "#/components/schemas/CompletionMistakeEvent"
        - $ref: "#/components/schemas/ToolErrorEvent"
        - $ref: "#/components/schemas/ToolResultEvent"
        - $ref: "#/components/schemas/LoopExitEvent"
        - $ref: "#/components/schemas/CompactionEvent"
        - $ref: "#/components/schemas/ProvidedToolCallEvent"

    ConsolidationCompletionEvent:
      type: object
      description: |
        A completion event emitted during memory consolidation.
        Note: for this stream the `type` field is emitted as an empty string.
      required: [type, done, completion, tool_calls]
      properties:
        type:
          type: string
          description: Always empty for consolidation events.
        done:
          type: boolean
        completion:
          type: string
        tool_calls:
          type: array
          items:
            $ref: "#/components/schemas/ToolCall"

    # ── MCP ─────────────────────────────────────────────────────────────
    ServerGatewayConfig:
      type: object
      description: |
        Exactly one of `http_gateway` or `command_gateway` must be provided.
        If neither or both are provided, the request is rejected with 400.
      properties:
        http_gateway:
          type: object
          required: [url]
          properties:
            url:
              type: string
            token:
              type: string
          description: Connect to a remote MCP server via URL.
        command_gateway:
          type: object
          required: [command]
          properties:
            command:
              type: string
            args:
              type: array
              items:
                type: string
            env:
              type: object
              additionalProperties:
                type: string
          description: Spawn a local MCP server process.

    MCPServerInfo:
      type: object
      description: A connected MCP server with its config and tools.
      required: [config, tools]
      properties:
        config:
          $ref: "#/components/schemas/ServerGatewayConfig"
        tools:
          $ref: "#/components/schemas/ToolRepr"

    # ── Memory ──────────────────────────────────────────────────────────
    MemoryDetail:
      type: object
      description: Full content of a named memory record.
      required: [agent, memory_name, content]
      properties:
        agent:
          type: string
        memory_name:
          type: string
        content:
          type: string
      example:
        agent: "agent_main"
        memory_name: "week_25"
        content: "The agent processed 15 tasks..."

    ConsolidatorConfig:
      type: object
      description: Memory consolidation configuration.
      required: [Model, Enabled, Instruction]
      properties:
        Model:
          type: string
          description: Model name used for consolidation.
        Enabled:
          type: boolean
          description: Whether automatic consolidation is enabled.
        Instruction:
          type: string
          description: Instruction passed to the consolidation agent.
      example:
        Model: "gpt-4"
        Enabled: true
        Instruction: "Summarize the day's activity"

    # ── Activity ────────────────────────────────────────────────────────
    ActivityRecord:
      type: object
      description: A single activity log entry.
      required: [date, content]
      properties:
        date:
          type: string
          description: Date in YYYY-MM-DD format.
        content:
          type: string
      example:
        date: "2025-01-01"
        content: "Agent processed task: daily_report"

    ActivityConfig:
      type: object
      description: Activity reporting configuration.
      required: [enabled, interval, model]
      properties:
        enabled:
          type: boolean
        interval:
          type: integer
          format: int64
          description: Flush interval in seconds.
        model:
          type: string
          description: Model name used to generate activity summaries.
      example:
        enabled: true
        interval: 120
        model: "gpt-4"

    # ── Agent ───────────────────────────────────────────────────────────
    AgentConfig:
      type: object
      description: Configuration for an agent. At minimum, a model must be specified.
      required: [model]
      properties:
        model:
          type: string
          description: Model identifier.
        memory:
          type: boolean
          description: Whether memory is enabled.
        description:
          type: string
        tool_servers:
          type: array
          description: Allowed tool server names.
          items:
            type: string
        system_prompt:
          type: string
          description: Custom system prompt.
      example:
        model: "gpt-4"
        memory: true
        description: "General assistant"
        tool_servers:
          - "filesystem"

    # ── Provider ────────────────────────────────────────────────────────
    ProviderConfig:
      type: object
      description: Configuration for an API provider (OpenAI-compatible endpoint).
      required: [name, base_url, api_type]
      properties:
        name:
          type: string
          description: Provider name.
        base_url:
          type: string
          description: Base URL for the API endpoint.
        key_ref:
          type: string
          description: Reference to the API key in secrets.
        api_type:
          type: string
          enum: [openai]
          description: API type.
        models:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/ModelConfig"
          description: Model configurations keyed by model name.
      example:
        name: "openai"
        base_url: "https://api.openai.com/v1"
        api_type: "openai"
        key_ref: "openai_key"
        models:
          gpt-4:
            temperature: 0.7

    ProviderConfigPatch:
      type: object
      description: Partial update for a provider. Only supplied fields are updated.
      properties:
        name:
          type: string
          nullable: true
        base_url:
          type: string
          nullable: true
        key_ref:
          type: string
          nullable: true
        api_type:
          type: string
          enum: [openai]
          nullable: true

    ModelConfig:
      type: object
      description: |
        Model configuration parameters. Provider-specific settings such as
        `temperature`, `max_tokens`, `top_p`, etc.
      example:
        temperature: 0.7
        max_tokens: 4096
        top_p: 1.0

    # ── Provided Tool Result ────────────────────────────────────────────
    ToolResultPayload:
      type: object
      description: Payload for resolving a client-provided tool call result.
      properties:
        result:
          type: array
          description: Tool call result content.
          items:
            $ref: "#/components/schemas/ContentPart"
        error_message:
          type: string
          description: Error message to relay to the agent if the tool call failed.
      example:
        result:
          - text: "Operation completed successfully"
            image_url: ""
        error_message: ""

  responses:
    MessageError:
      description: Error with a human-readable message.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: Bad request. The body is either an error message or a validation error.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/Error"
              - $ref: "#/components/schemas/ValidationError"